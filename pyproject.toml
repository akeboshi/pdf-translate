[project]
name = "pdf-translate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "akeboshi", email = "6316851+akeboshi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "pymupdf>=1.28.2",
]

[project.scripts]
pdf-translate = "pdf_translate:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
